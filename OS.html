<!DOCTYPE html>
<html>

    <body style="background-size: cover; background-color: #0e0d0d; overflow-x: hidden; 
    background-image: url('Media/wallpaper.jpeg');" >


        <div class="taskbar">
            <p><img class="logo" id="musicopen" src="Media\Gramophone_Vinyl_LP_Record_PNG_Transparent_Clip_Art_Image.png" alt="Open music window"></p>
            <p><img class="logo" id="notesopen" src="Media\guitar.png"></p>
        </div>

        

        <div>
            <form id="googleSearchForm">
                <input 
                type="text" 
                name="q"
                id="searchInput" 
                placeholder="Google Search" 
                autocomplete="on" 
                />
            </form>
        </div>

        <div>
            <img class="AngelB" src="Media\Анджел.jpeg">
            <img class="AngelW" src="Media\evan rosier _ marauders era aes_.jpeg">
        </div>

        
        <div class="musicwindow" id="musicwindow">

            <div class="musicwindow-header" id="musicwindowheader">          
                <span>Music</span>
                <button type="button" id="musiclose" aria-label="Close music window"> x </button>   
            </div>
            <div>

            </div>

        </div>


        <div class="noteswindow" id="noteswindow">

            <div class="noteswindow-header" id="noteswindowheader">
                <span> Journal </span>
                <button type="button" id="notesclose" aria-label="Close Notes Window"> x </button>
            </div>

            <div class="noteswindow-content">
                <div class="sidebar">
                </div>
                <div class="notes-main">
                    <div class="notes-title">
                        <p id="notesTitle" style="margin: 0;"></p>
                    </div>
                    <div id="notesContent"></div>
                </div>
                
            </div>



        <link rel="stylesheet" type="text/css" href="stylesheet.css" />
        <script src="script.js"></script>
    </body>
</html>
