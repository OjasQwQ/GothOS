<!DOCTYPE html>
<html>
    <head>
    
        <link rel="stylesheet" type="text/css" href="stylesheet.css?v=3" />
        <link rel="stylesheet" type="text/css" href="musicplayer.css" />
        
    </head>

    <body style="background-size: cover; background-color: #0e0d0d; overflow-x: hidden; 
    background-image: url('Media/wallpaper.jpeg'); background-repeat: no-repeat;" >
    <canvas id="visualizer"></canvas>

        <div class="bat-pet" id="bat">
            <svg class="bat-svg" viewBox="0 0 100 80" aria-hidden="true">
                <g class="bat-wings">

                    //Copilot used here cuz this is way outta my league
                    <g class="bat-wing bat-wing-upper">
                        <path class="bat-wing-shape" d="M 49 40 C 41 26, 30 12, 18 9 C 20 18, 16 21, 8 19 C 12 29, 18 36, 28 40 C 19 38, 13 42, 8 49 C 20 56, 35 51, 49 44 Z" />
                        <path class="bat-wing-vein" d="M 48 42 C 37 32, 28 22, 18 9 M 43 43 C 31 41, 20 38, 8 19 M 39 45 C 27 46, 17 47, 8 49" />
                    </g>
                    <g class="bat-wing bat-wing-lower">
                        <path class="bat-wing-shape" d="M 49 40 C 41 54, 30 68, 18 71 C 20 62, 16 59, 8 61 C 12 51, 18 44, 28 40 C 19 42, 13 38, 8 31 C 20 24, 35 29, 49 36 Z" />
                        <path class="bat-wing-vein" d="M 48 38 C 37 48, 28 58, 18 71 M 43 37 C 31 39, 20 42, 8 61 M 39 35 C 27 34, 17 33, 8 31" />
                    </g>
                </g>
                <path class="bat-body" d="M 36 40 C 45 32, 59 33, 72 39 C 66 45, 51 50, 37 45 Z" />
                <path class="bat-chest" d="M 54 39 C 59 38, 64 39, 68 41 C 63 44, 59 45, 54 45 Z" />
                <path class="bat-ear" d="M 71 34 L 68 23 L 79 31 Z M 81 31 L 92 24 L 87 37 Z" />
                <ellipse class="bat-head" cx="80" cy="38" rx="10" ry="8" />
                <ellipse class="bat-eye" cx="84" cy="36" rx="1.5" ry="2" />
                <path class="bat-nose" d="M 89 39 L 94 40 L 89 42 Z" />
                <path class="bat-leg" d="M 43 45 L 40 52 L 36 53 M 53 46 L 51 52 L 47 53" />
                <path class="bat-claw" d="M 35 53 L 33 51 M 36 53 L 35 50 M 46 53 L 44 51 M 47 53 L 46 50" />
            </svg>
        </div>

        <div class="taskbar">
            <p><img class="logo" id="musicopen" src="Media\CD1.svg" alt="Open music window"></p>
            <p><img class="logo" id="notesopen" src="Media\book-journa-notes.svg"></p>
            <p><img class="logo" id="calcopen" src="Media\gothic-calculator.svg"></p>
            <p><img class="logo" id="todoopen" src="Media\to-do.svg"></p>
        </div>

        <div>
            <form id="googleSearchForm">
                <div class= "search-wrapper">
                    <input 
                    type="text" 
                    name="q"
                    id="searchInput" 
                    placeholder="Google Search" 
                    autocomplete="on" 
                    />
                    <img class="search-icon" src="Media\icons8-search-50.png">
                </div>
            </form> 
        </div>

        <div>
            <img class="AngelB" src="Media\Анджел.jpeg">
            <img class="AngelW" src="Media\evan rosier _ marauders era aes_.jpeg">
        </div>

        
        <div class="musicwindow" id="musicwindow">

            <div class="musicwindow-header" id="musicwindowheader">          
                <span>Music</span>
                <button type="button" id="musiclose" aria-label="Close music window"> x </button>   
            </div>

            <div class="musicwindow-content">
                <div class="player-row">
                    <button type="button" class="backbtn" aria-label="Previous track"> ‹ </button>
                    <div class="player">
                        <div class="record"></div>
                            <div class="tone-arm">
                                <div class="control"></div>
                            </div>
                            <button type="button" class="btn" aria-label="Play playback" aria-pressed="false"></button>
                            <div class="slider-container">
                                <input
                                type="range"
                                class="slider"
                                min="0"
                                max="1"
                                step="0.1"
                                value="0.7"
                                aria-label="Volume" />
                            </div>
                        </div>
                    <button type="button" class="nextbtn" aria-label="Next track"> › </button>
                </div>
                <audio loop class="my-song" id= "my-song" src="Media/My_Own_Summer.mp3" preload="auto"></audio>
                </div>
            </div> 
            
        </div>

        <div id="music_popup" class="music_popup">
            <p> Now Playing: </p>
            <h1 class="song_title_popup">_</h1>
        </div>


        
        <div class="noteswindow" id="noteswindow">

            <div class="noteswindow-header" id="noteswindowheader">
                <span> Journal </span>
                <button type="button" id="notesclose" aria-label="Close Notes Window"> x </button>
            </div>

            <div class="noteswindow-content">
                <div class="sidebar">
                </div>
                <div class="notes-main">
                    <div class="notes-title">
                        <p id="notesTitle" style="margin: 0;"></p>
                    </div>
                    <div id="notesContent"></div>
                </div>
            </div>
        </div>

        <div class="calc-window" id="calc-window">
            <div class="calcwindow-header" id="calcwindow-header">
                <span> Calculator </span>
                <button type="button" id="calcclose" aria-label="Close Calculator Window"> x </button>
            </div>
            <div class="calcwindow-content">
                <div class="calc-display">
                    <div class="previous-operand" id="previous-operand"></div>
                    <div class="current-operand" id="current-operand"></div>
                </div>
                <div class="calc-buttons">
                    <button class="calc-btn calc-function" onclick="clearScreen()">C</button>
                    <button class="calc-btn calc-function" onclick="deleteLast()">⌫</button>
                    <button class="calc-btn calc-function" onclick="appendOperator('%')">%</button>
                    <button class="calc-btn calc-operator" onclick="appendOperator('/')">÷</button>

                    <button class="calc-btn" onclick="appendNumber('7')">7</button>
                    <button class="calc-btn" onclick="appendNumber('8')">8</button>
                    <button class="calc-btn" onclick="appendNumber('9')">9</button>
                    <button class="calc-btn calc-operator" onclick="appendOperator('*')">×</button>

                    <button class="calc-btn" onclick="appendNumber('4')">4</button>
                    <button class="calc-btn" onclick="appendNumber('5')">5</button>
                    <button class="calc-btn" onclick="appendNumber('6')">6</button>
                    <button class="calc-btn calc-operator" onclick="appendOperator('-')">-</button>

                    <button class="calc-btn" onclick="appendNumber('1')">1</button>
                    <button class="calc-btn" onclick="appendNumber('2')">2</button>
                    <button class="calc-btn" onclick="appendNumber('3')">3</button>
                    <button class="calc-btn calc-operator" onclick="appendOperator('+')">+</button>

                    <button class="calc-btn calc-zero" onclick="appendNumber('0')">0</button>
                    <button class="calc-btn" onclick="appendDecimal('.')">.</button>
                    <button class="calc-btn calc-equals" onclick="calculate()">=</button>
                </div>
            </div>
        </div>

        <div class="todo-window" id="todo-window">
            <div class="todowindow-header" id="todowindow-header">
                <span> To-Do </span>
                <button type="button" id="todoclose" aria-label="Close To-Do Window"> x </button>
            </div>
            <div class="todowindow-content">
                <form id="todoForm" class="todo-form">
                    <input type="text" id="todoInput" placeholder="Add a task..." autocomplete="off" />
                    <button type="submit">+</button>
                </form>
                <ul id="todoList" class="todo-list"></ul>
            </div>
        </div>


        <script src="music.js"></script>
        <script src="script.js"></script>
        <script src="visualizer.js"></script>
    </body>
</html>
