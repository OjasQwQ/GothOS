<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">Love You to Death — Type O Negative inspired vinyl</title>
  <desc id="desc">A dark gothic record with black cherry and burgundy marbling, subtle grooves, and a black label with pale gothic-inspired ornament.</desc>
  <defs>
    <radialGradient id="vinyl" cx="38%" cy="30%" r="76%">
      <stop offset="0" stop-color="#59101d"/>
      <stop offset=".34" stop-color="#310711"/>
      <stop offset=".72" stop-color="#120509"/>
      <stop offset="1" stop-color="#050405"/>
    </radialGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e1830" stop-opacity=".82"/>
      <stop offset=".48" stop-color="#450814" stop-opacity=".4"/>
      <stop offset="1" stop-color="#b32a42" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3a0aa" stop-opacity=".24"/>
      <stop offset=".3" stop-color="#8b182e" stop-opacity=".04"/>
      <stop offset=".62" stop-color="#000" stop-opacity=".38"/>
      <stop offset="1" stop-color="#e36a7b" stop-opacity=".13"/>
    </linearGradient>
    <filter id="marble">
      <feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="42" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        1 0 0 0 .04
        0 .24 0 0 0
        0 .05 0 0 0
        0 0 0 .62 0" result="dark"/>
      <feBlend in="SourceGraphic" in2="dark" mode="multiply"/>
    </filter>
    <clipPath id="recordClip"><circle cx="250" cy="250" r="239"/></clipPath>
  </defs>

  <circle cx="250" cy="250" r="244" fill="#030203"/>
  <circle cx="250" cy="250" r="239" fill="url(#vinyl)" stroke="#7e2638" stroke-opacity=".55" stroke-width="1.3"/>
  <g clip-path="url(#recordClip)">
    <rect x="10" y="10" width="480" height="480" fill="url(#wine)" filter="url(#marble)" opacity=".95"/>
    <rect x="10" y="10" width="480" height="480" fill="url(#shine)"/>

    <!-- Smoky black-cherry marbling -->
    <g fill="#070407" opacity=".53">
      <path d="M76 121 Q108 85 138 112 L145 143 L121 161 L91 150 Z"/>
      <path d="M184 66 Q214 83 203 113 L179 130 L164 101 Z"/>
      <path d="M310 69 Q342 85 331 119 L304 135 L292 106 Z"/>
      <path d="M386 137 Q413 126 430 157 L413 184 L388 174 Z"/>
      <path d="M69 222 Q98 201 118 226 L110 254 L84 262 Z"/>
      <path d="M398 230 Q428 214 438 246 L420 274 L397 266 Z"/>
      <path d="M99 347 Q126 324 148 350 L135 379 L111 382 Z"/>
      <path d="M195 415 Q219 389 239 413 L231 440 L204 444 Z"/>
      <path d="M321 390 Q346 365 370 391 L358 420 L332 422 Z"/>
      <path d="M372 322 Q398 302 416 328 L405 356 L383 359 Z"/>
    </g>
    <g fill="none" stroke-linecap="round">
      <circle cx="250" cy="250" r="112" stroke="#d56a7c" stroke-opacity=".16"/>
      <circle cx="250" cy="250" r="119" stroke="#070306" stroke-opacity=".55"/>
      <circle cx="250" cy="250" r="127" stroke="#b94b60" stroke-opacity=".14"/>
      <circle cx="250" cy="250" r="136" stroke="#070306" stroke-opacity=".48"/>
      <circle cx="250" cy="250" r="145" stroke="#d56a7c" stroke-opacity=".13"/>
      <circle cx="250" cy="250" r="155" stroke="#070306" stroke-opacity=".46"/>
      <circle cx="250" cy="250" r="166" stroke="#d56a7c" stroke-opacity=".12"/>
      <circle cx="250" cy="250" r="178" stroke="#070306" stroke-opacity=".42"/>
      <circle cx="250" cy="250" r="190" stroke="#d56a7c" stroke-opacity=".12"/>
      <circle cx="250" cy="250" r="202" stroke="#070306" stroke-opacity=".4"/>
      <circle cx="250" cy="250" r="214" stroke="#d56a7c" stroke-opacity=".11"/>
      <circle cx="250" cy="250" r="226" stroke="#070306" stroke-opacity=".36"/>
      <circle cx="250" cy="250" r="235" stroke="#d56a7c" stroke-opacity=".1"/>
    </g>
    <path d="M69 150 A200 200 0 0 1 176 63" fill="none" stroke="#e4a0aa" stroke-opacity=".2" stroke-width="10"/>
    <path d="M331 66 A200 200 0 0 1 432 171" fill="none" stroke="#d56a7c" stroke-opacity=".13" stroke-width="7"/>
  </g>

  <!-- Gothic-leaning monochrome centre label -->
  <circle cx="250" cy="250" r="91" fill="#080608" stroke="#7b3542" stroke-width="1.6"/>
  <circle cx="250" cy="250" r="83" fill="none" stroke="#c9b8b5" stroke-opacity=".65" stroke-width="1"/>
  <circle cx="250" cy="250" r="76" fill="none" stroke="#6f4149" stroke-opacity=".8" stroke-width="1"/>

  <!-- Symmetrical thorn / vine ornament -->
  <g fill="none" stroke="#d5c7c3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
    <path d="M250 186 C236 204 236 218 250 231 C264 218 264 204 250 186 Z"/>
    <path d="M250 190 V233 M250 205 L237 198 M250 214 L264 205"/>
    <path d="M250 268 C229 258 220 273 231 287 C239 296 246 303 250 313 C254 303 261 296 269 287 C280 273 271 258 250 268 Z"/>
    <path d="M250 271 V307 M250 281 L237 276 M250 291 L264 282 M250 300 L239 294"/>
    <path d="M206 250 C218 239 229 239 240 250 C229 261 218 261 206 250 Z"/>
    <path d="M294 250 C282 239 271 239 260 250 C271 261 282 261 294 250 Z"/>
    <path d="M211 250 H239 M289 250 H261"/>
  </g>

  <g fill="#e4d9d6" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="250" y="222" font-size="9" letter-spacing="1.5">TYPE O NEGATIVE</text>
    <text x="250" y="338" font-size="8" letter-spacing="1.2">LOVE YOU TO DEATH</text>
  </g>

  <!-- Centre spindle -->
  <circle cx="250" cy="250" r="8" fill="#c9b9b7"/>
  <circle cx="250" cy="250" r="4" fill="#f2e9e4"/>
  <circle cx="250" cy="250" r="239" fill="none" stroke="#d28b96" stroke-opacity=".2" stroke-width="1"/>
</svg>