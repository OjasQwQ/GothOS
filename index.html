<!DOCTYPE html>
<html lang="en">
    <head>

        <title>GothOS</title>
        <style>

    <body style="background-color: #000;">
        <div id="home-screen">

            </video>

                //TAB
                <div id="tab" style="position: absolute; top: 0; left: 0; width: 100%; display: flex; backdrop-filter: blur(20px);
